<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102b4e"><title>Hi5 Online Reader | Hi5 Education Centre</title>
<meta name="robots" content="noindex,follow"><link rel="icon" href="/images/logo.png">
<style>
:root{color-scheme:light;--navy:#102b4e;--blue:#1769c2;--ink:#243449}
*{box-sizing:border-box}body{margin:0;background:#edf2f7;color:var(--ink);font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 15px;background:var(--navy);color:white;box-shadow:0 2px 10px #102b4e30}
.brand{display:flex;align-items:center;gap:9px;min-width:0}.brand img{width:36px;height:36px;border-radius:8px}.brand strong{display:block;font-size:14px}.brand small{display:block;color:#c8d8ea;font-size:11px;margin-top:3px}
button,a.tool{font:600 12px Arial,sans-serif;border:1px solid #d5dfeb;border-radius:9px;padding:9px 12px;background:white;color:var(--navy);text-decoration:none;cursor:pointer}
main{max-width:1000px;margin:auto;padding:16px 12px 30px}.heading{text-align:center;margin:8px 0 14px}.heading h1{font-size:clamp(18px,3vw,25px);margin:0 0 5px}.heading p{font-size:12px;color:#64748b;margin:0}
.toolbar{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:7px;margin-bottom:12px}.toolbar button:disabled{opacity:.4;cursor:not-allowed}
#pageCount{font-size:12px;font-weight:700;color:#334155;min-width:78px;text-align:center}
#pages{display:flex;flex-direction:column;align-items:center;gap:14px}.sheet{width:100%;max-width:850px;min-height:360px;background:white;box-shadow:0 3px 16px #0f27441c;border:1px solid #dce4ed;border-radius:3px;display:flex;align-items:center;justify-content:center;overflow:hidden}.sheet canvas{display:block;width:100%;height:auto}
#loading{padding:35px;text-align:center;color:#52647a;font-size:14px}.error{color:#a12626!important}
.footer{text-align:center;padding:18px;color:#64748b;font-size:11px}
@media(max-width:600px){header{padding:9px}.brand img{width:31px;height:31px}header a.tool{padding:8px;font-size:11px}main{padding:12px 7px 24px}.sheet{min-height:260px}.toolbar{gap:5px}.toolbar button{padding:8px 9px}}
@media print{header,.heading,.toolbar,.footer{display:none!important}body{background:white}main{padding:0}.sheet{box-shadow:none;border:0;break-after:page}}
</style></head>
<body>
<header><div class="brand"><img src="/images/logo.png" alt="Hi5"><span><strong>Hi5 Education Centre</strong><small>Learn Today, Lead Tomorrow</small></span></div><a class="tool" href="./">← Back</a></header>
<main><section class="heading"><h1 id="docTitle">Online Reading</h1><p>Read comfortably. Swipe or scroll through the pages.</p></section>
<nav class="toolbar" aria-label="Reading controls"><button id="prev" disabled>‹ Previous</button><span id="pageCount">Page — of —</span><button id="next" disabled>Next ›</button><button id="zoom">＋ Zoom</button><button id="full">⛶ Fullscreen</button></nav>
<div id="loading">Opening your learning material…</div><div id="pages"></div></main>
<footer class="footer">© 2026 Hi5 Education Centre</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
 const q=new URLSearchParams(location.search),file=q.get('file'),title=q.get('title')||'Learning Material';
 const loading=document.getElementById('loading'),pages=document.getElementById('pages'),counter=document.getElementById('pageCount');
 document.getElementById('docTitle').textContent=title;
 if(!file){loading.textContent='No document was selected.';loading.classList.add('error');return;}
 let url;try{url=new URL(file,location.href);if(url.protocol!=='https:'||url.hostname!=='hi5educentre256.github.io'||!url.pathname.toLowerCase().endsWith('.pdf'))throw Error();}catch(e){loading.textContent='This document address is not valid.';loading.classList.add('error');return;}
 if(!window.pdfjsLib){loading.textContent='The reader could not load. Please check your connection and refresh.';loading.classList.add('error');return;}
 pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 let pdf=null,current=1,scale=1.15,observer=null,rendering=new Set();
 const canvases=[];
 function update(){counter.textContent='Page '+current+' of '+pdf.numPages;document.getElementById('prev').disabled=current<=1;document.getElementById('next').disabled=current>=pdf.numPages;}
 async function draw(n){if(rendering.has(n)||canvases[n-1].dataset.done)return;rendering.add(n);try{const page=await pdf.getPage(n),base=page.getViewport({scale:1});const width=Math.min((pages.clientWidth||800)-10,900)*scale;const viewport=page.getViewport({scale:width/base.width});const canvas=canvases[n-1],ctx=canvas.getContext('2d');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);await page.render({canvasContext:ctx,viewport}).promise;canvas.dataset.done='1';}catch(e){}finally{rendering.delete(n);}}
 function setCurrent(n){current=Math.max(1,Math.min(pdf.numPages,n));update();const target=document.getElementById('page-'+current);if(target){target.scrollIntoView({behavior:'smooth',block:'start'});draw(current);if(current<pdf.numPages)draw(current+1);}}
 pdfjsLib.getDocument({url:url.href}).promise.then(async doc=>{
  pdf=doc;loading.style.display='none';
  for(let n=1;n<=pdf.numPages;n++){const wrap=document.createElement('section');wrap.className='sheet';wrap.id='page-'+n;const canvas=document.createElement('canvas');canvas.setAttribute('aria-label','Page '+n);wrap.appendChild(canvas);pages.appendChild(wrap);canvases.push(canvas);}
  observer=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){const n=Number(entry.target.id.replace('page-',''));current=n;update();draw(n);if(n<pdf.numPages)draw(n+1);}});},{rootMargin:'500px 0px'});
  document.querySelectorAll('.sheet').forEach(el=>observer.observe(el));update();draw(1);
 }).catch(()=>{loading.textContent='We could not open this document. Please refresh or contact Hi5 support.';loading.classList.add('error');});
 document.getElementById('prev').addEventListener('click',()=>setCurrent(current-1));
 document.getElementById('next').addEventListener('click',()=>setCurrent(current+1));
 document.getElementById('zoom').addEventListener('click',()=>{scale=scale===1.15?1.35:1.15;canvases.forEach(c=>{delete c.dataset.done;c.width=0;c.height=0;});draw(current);});
 document.getElementById('full').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();});
})();
</script></body></html>
